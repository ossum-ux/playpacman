<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Clone - Full Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- Schermata Menu -->
        <div id="menu-screen" class="overlay">
            <h1>PAC-MAN</h1>
            <div class="instructions">
                <p>Usa le <b>Frecce Direzionali</b> per muoverti.</p>
                <p>Mangia tutti i pallini ed evita i fantasmi!</p>
            </div>
            <button id="start-button">GIOCA</button>
        </div>

        <!-- Schermata Game Over -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 id="status-title">GAME OVER</h1>
            <p>Punteggio Finale: <span id="final-score">0</span></p>
            <button id="restart-button">RIPROVA</button>
        </div>

        <!-- Interfaccia di Gioco -->
        <div id="game-ui" class="hidden">
            <div class="score-container">SCORE: <span id="score-val">0</span></div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
